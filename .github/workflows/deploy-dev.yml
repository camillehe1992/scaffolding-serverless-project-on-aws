name: Deploy Dev Environment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/build-dependencies-zip.sh"
      - "src/**"
      - "terraform/**"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy-security:
    name: Deploy Security Unit
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: dev
      unit: security

  deploy-dynamodb:
    name: Deploy DynamoDB Unit
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: dev
      unit: dynamodb

  deploy-api:
    name: Deploy API Unit
    needs: [deploy-security, deploy-dynamodb]
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: dev
      unit: api
