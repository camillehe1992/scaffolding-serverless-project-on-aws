name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: true
      confirm_destroy:
        description: Type DELETE to confirm destroying the environment
        type: string
        default: ""
        required: false

run-name: Destroy ${{ inputs.environment }} Environment

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  destroy-api:
    name: Destroy API Unit
    if: ${{ inputs.confirm_destroy == 'DELETE' }}
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      plan_environment: ${{ inputs.environment == 'prod' && 'prod-plan' || inputs.environment }}
      apply_environment: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment }}
      is_destroy: true
      unit: api

  destroy-dynamodb:
    name: Destroy DynamoDB Unit
    needs: [destroy-api]
    if: ${{ always() && inputs.confirm_destroy == 'DELETE' && needs.destroy-api.result == 'success' }}
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      plan_environment: ${{ inputs.environment == 'prod' && 'prod-plan' || inputs.environment }}
      apply_environment: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment }}
      is_destroy: true
      unit: dynamodb

  destroy-security:
    name: Destroy Security Unit
    needs: [destroy-api]
    if: ${{ always() && inputs.confirm_destroy == 'DELETE' && needs.destroy-api.result == 'success' }}
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      plan_environment: ${{ inputs.environment == 'prod' && 'prod-plan' || inputs.environment }}
      apply_environment: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment }}
      is_destroy: true
      unit: security
