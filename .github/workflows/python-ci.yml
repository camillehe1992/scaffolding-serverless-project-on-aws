name: Validate Python App

on:
  pull_request:
    paths:
      - ".github/workflows/python-ci.yml"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-ci.yml"
      - "src/**"

env:
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Unit Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements-dev.txt

      - name: Install Dependencies
        run: pip install -r src/requirements-dev.txt

      - name: Run Unit Tests
        working-directory: src
        run: python -m pytest tests/unit/ -v

      - name: Run Pylint
        working-directory: src
        run: pylint portal/app tests/unit tests/conftest.py
