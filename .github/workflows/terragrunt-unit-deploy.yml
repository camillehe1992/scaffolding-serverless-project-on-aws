name: Deploy or Destroy Terragrunt Unit

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Terragrunt unit to deploy or destroy
        type: choice
        options:
          - security
          - dynamodb
          - api
        default: api
        required: true
      environment:
        description: Environment to run against
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: true
      confirm_destroy:
        description: Type DELETE to destroy instead of deploy
        type: string
        default: ""
        required: false

run-name: ${{ inputs.confirm_destroy == 'DELETE' && format('Destroy {0} from {1} environment', inputs.unit, inputs.environment) || format('Deploy {0} to {1} environment', inputs.unit, inputs.environment) }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy-unit:
    name: ${{ inputs.confirm_destroy == 'DELETE' && 'Destroy' || 'Deploy' }}
    uses: ./.github/workflows/reusable-terragrunt-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      plan_environment: ${{ inputs.environment == 'prod' && 'prod-plan' || inputs.environment }}
      apply_environment: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment }}
      is_destroy: ${{ inputs.confirm_destroy == 'DELETE' }}
      unit: ${{ inputs.unit }}
