name: Set Up Terragrunt

description: >
  Shared setup for the Terragrunt plan and apply jobs: restore the Terraform
  provider cache, install the toolchain, configure AWS credentials, and
  initialize Terragrunt.

inputs:
  unit:
    description: Terragrunt unit being set up
    required: true
  python_version:
    description: Python version to install for the api unit
    required: true
  terraform_version:
    description: Terraform version to install
    required: true
  terragrunt_version:
    description: Terragrunt version to install
    required: true
  tf_plugin_cache_dir:
    description: Terraform provider plugin cache directory
    required: true
  working_directory:
    description: Directory that contains the Terragrunt unit
    required: true
  role_to_assume:
    description: AWS IAM role ARN to assume
    required: true
  role_session_name:
    description: AWS role session name to use
    required: true
  aws_region:
    description: AWS region to target
    required: true

runs:
  using: composite
  steps:
    - name: Cache Terraform Providers
      id: cache-terraform-providers
      uses: actions/cache@v5
      with:
        path: ${{ inputs.tf_plugin_cache_dir }}
        key: terraform-providers-${{ runner.os }}-${{ inputs.terraform_version }}-${{ hashFiles('terraform/**/*.hcl', 'terraform/**/*.tf', '.github/workflows/reusable-terragrunt-deploy.yml') }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-${{ inputs.terraform_version }}-

    - name: Configure Terraform Plugin Cache
      id: configure-terraform-plugin-cache
      shell: bash
      env:
        TF_PLUGIN_CACHE_DIR: ${{ inputs.tf_plugin_cache_dir }}
      run: |
        mkdir -p "${TF_PLUGIN_CACHE_DIR}"
        mkdir -p "${HOME}/.terraform.d"
        cat > "${HOME}/.terraformrc" <<EOF
        plugin_cache_dir = "${TF_PLUGIN_CACHE_DIR}"
        EOF

    - name: Set Up Python
      id: set-up-python
      if: ${{ inputs.unit == 'api' }}
      uses: actions/setup-python@v6
      with:
        cache: pip
        cache-dependency-path: src/requirements.txt
        python-version: ${{ inputs.python_version }}

    - name: Set Up Terraform
      id: set-up-terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
        terraform_version: ${{ inputs.terraform_version }}

    - name: Set Up Terragrunt
      id: set-up-terragrunt
      uses: gruntwork-io/terragrunt-action@v3.4.0
      with:
        tg_version: ${{ inputs.terragrunt_version }}
        tf_path: terraform

    - name: Configure AWS Credentials
      id: configure-aws-credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        role-session-name: ${{ inputs.role_session_name }}
        aws-region: ${{ inputs.aws_region }}

    - name: Initialize Terragrunt
      id: initialize-terragrunt
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terragrunt init -reconfigure -no-color
